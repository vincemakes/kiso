name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR run is wasted minutes, and the account's Actions budget is
# shared with every other project on this machine. Cancel the older run when a
# branch is pushed again — but NEVER on main: the release rule is "CI green on
# the bump commit", and a cancelled main run would leave that unanswerable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Area 7: a CLEAN checkout installs from the lockfile, then the full
      # gate runs: build, typecheck (all packages + root scripts + tests),
      # tests, size gate (core only), pack gate, consumer smoke, demo check.
      - run: npm ci
      - run: npm run check

  # Windows (plan rev 3.1, P5): not a required check while Windows stays
  # install-refused. Build, typecheck, the process module probed for real
  # (Git Bash, taskkill, the CIM start time), then the unit pool. The pty
  # pool stays POSIX (its driver is Python's pty), and so do the check
  # chain's sh / python3 / GNU tar steps.
  windows:
    runs-on: windows-latest
    steps:
      # the npm tarballs carry LF; a CRLF checkout would test bytes no user gets
      - run: git config --global core.autocrlf false
      # Defender's real-time scan of every file the suites create stalls the
      # runner for seconds at a time: on 2026-10-07, 4 of 29 windows runs went
      # red, each a cluster of unrelated store-heavy tests timing out together
      # (one file: median 291 ms, worst 6,265 ms). The workspace and the temp
      # roots are excluded; a runner that refuses says so and the job goes on.
      - name: Exclude the workspace and temp from Defender's real-time scan
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP" -ErrorAction Stop
            Write-Host "Defender exclusions: $((Get-MpPreference).ExclusionPath -join ', ')"
          } catch {
            Write-Host "::warning::Defender exclusion not applied: $($_.Exception.Message)"
          }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      # --force until P6: kiso-code's "os" field still refuses win32 (the
      # install gate), and npm ci applies it to a workspace too
      - run: npm ci --force
      - run: npm run build
      - run: npm run typecheck
      - run: node scripts/windows-probe.mjs
      # 15 s per test on this job only (vitest's default 5 s holds on Linux and
      # locally): a runner stall must not read as a failure, and a test that
      # truly hangs still fails here
      - run: npx vitest run -c vitest.unit.config.ts --testTimeout=15000
