name: Web

# The web app (apps/web) is a private workspace outside the root build and
# check. This job runs only when something it depends on changes: the app itself,
# the packages it consumes, the terminal product (its ./policy door, and the recap
# line one proof compares against), the lockfile, or this file. The repository is
# public, so the minutes are free; the path filter is for speed.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/cli/**"
      - "packages/core/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "packages/client/**"
      - "packages/runtime/**"
      - "packages/tools-node/**"
      - "packages/evals/**"
      - "packages/provider-*/**"
      - "packages/tui/**"
      - "packages/tui-cells/**"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/cli/**"
      - "packages/core/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "packages/client/**"
      - "packages/runtime/**"
      - "packages/tools-node/**"
      - "packages/evals/**"
      - "packages/provider-*/**"
      - "packages/tui/**"
      - "packages/tui-cells/**"
      - "package-lock.json"
      - ".github/workflows/web.yml"

# Same rule as ci.yml: cancel a superseded PR run, never one on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # the packages the app and the proofs use, built from source
      - run: npm run build

      # build, typecheck, the gates (size, deps, imports, names, paths, CJK) and every
      # proof: the kill -9 ones and the page proofs, which drive the runner's own
      # headless Chrome over the DevTools protocol.
      - run: npm run check:full -w @vincemakes/kiso-web
