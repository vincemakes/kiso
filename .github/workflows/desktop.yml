name: Desktop

# The desktop app (apps/desktop) is a private workspace outside the root build and
# check. This job runs only when something it depends on changes: the app itself,
# the packages it consumes, the terminal product (its ./policy door, and the recap
# line one proof compares against), the lockfile, or this file. The repository is
# public, so the minutes are free; the path filter is for speed.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/core/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "packages/client/**"
      - "packages/runtime/**"
      - "packages/tools-node/**"
      - "packages/evals/**"
      - "packages/provider-*/**"
      - "packages/tui/**"
      - "packages/tui-cells/**"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "packages/core/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "packages/client/**"
      - "packages/runtime/**"
      - "packages/tools-node/**"
      - "packages/evals/**"
      - "packages/provider-*/**"
      - "packages/tui/**"
      - "packages/tui-cells/**"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"

# Same rule as ci.yml: cancel a superseded PR run, never one on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Electron 44 has no postinstall: npm ci installs its package, not its ~300 MB
      # binary, which is fetched the first time Electron runs. Nothing here runs it.
      - name: npm ci did not download Electron's binary
        run: test ! -e node_modules/electron/dist

      # the packages the app and the proofs use, built from source
      - run: npm run build

      # build, typecheck, the gates (size, deps, imports, names, CJK) and the daily
      # proofs (no Electron, no kill -9). The full proofs need Electron and a Mac.
      - run: npm run check -w @vincemakes/kiso-desktop
