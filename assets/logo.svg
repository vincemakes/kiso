<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!-- kiso (foundation) logo: an 8x8 pixel block-letter K — dark blocks on a
       transparent background. The bottom row is solid: the foundation/bedrock
       (foundation) the framework is named for. -->
  <rect x="0" y="0" width="1" height="1" fill="#1a1a1a"/>
  <rect x="6" y="0" width="2" height="1" fill="#1a1a1a"/>
  <rect x="0" y="1" width="1" height="1" fill="#1a1a1a"/>
  <rect x="5" y="1" width="2" height="1" fill="#1a1a1a"/>
  <rect x="0" y="2" width="1" height="1" fill="#1a1a1a"/>
  <rect x="4" y="2" width="2" height="1" fill="#1a1a1a"/>
  <rect x="0" y="3" width="1" height="1" fill="#1a1a1a"/>
  <rect x="3" y="3" width="2" height="1" fill="#1a1a1a"/>
  <rect x="0" y="4" width="1" height="1" fill="#1a1a1a"/>
  <rect x="2" y="4" width="2" height="1" fill="#1a1a1a"/>
  <rect x="0" y="5" width="1" height="1" fill="#1a1a1a"/>
  <rect x="4" y="5" width="2" height="1" fill="#1a1a1a"/>
  <rect x="0" y="6" width="1" height="1" fill="#1a1a1a"/>
  <rect x="6" y="6" width="2" height="1" fill="#1a1a1a"/>
  <rect x="0" y="7" width="8" height="1" fill="#1a1a1a"/>
</svg>
